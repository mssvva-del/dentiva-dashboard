# This app is the only package here. pnpm 9 refuses to install when a
# pnpm-workspace.yaml exists without a packages field — which is what CI
# hit on its first run, while pnpm 11 locally tolerated the omission.
packages:
  - '.'

allowBuilds:
  '@clerk/shared': set this to true or false
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
  unrs-resolver: set this to true or false
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - "@clerk/shared"
verifyDepsBeforeRun: false
