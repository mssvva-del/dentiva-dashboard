name: Dashboard CI

# Blocking. This repo auto-deploys to Vercel on merge to main, so a type error, a
# schema that disagrees with the backend, or a build failure reaches the clinics
# using the product without anything in between. Until now the only workflow here
# was the advisory review job.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is on pnpm (pnpm-lock.yaml, lockfileVersion 9) — npm ci fails
      # here with "Dependencies lock file is not found", which is exactly what
      # the first run of this workflow did.
      # Match the version used locally so CI and a developer machine resolve the
      # lockfile identically.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Node 22, not 20: pnpm 11 loads node:sqlite, which does not exist before
      # Node 22 — the third CI failure was exactly that, inside setup-node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm test

      # Catches what typecheck can't: a client component missing "use client",
      # a server/client boundary violation, a bad import — all of which have
      # broken this app before and only show up at build time.
      - name: Build
        run: pnpm run build
        env:
          # Clerk validates the KEY FORMAT at build time (it decodes the domain
          # out of it), so an arbitrary placeholder fails prerendering with
          # "The publishableKey passed to Clerk is invalid". This is a real
          # test-shaped key for clerk.example.com and reaches nothing.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_API_URL: https://api.example.com
